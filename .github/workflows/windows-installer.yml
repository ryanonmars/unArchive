name: Windows installer

# Push a tag such as v0.1.0 to build the installer and publish a release.
# Run the workflow manually to build an installer artifact without releasing.
# The import safety tests need private CPS fixtures, so run `npm test` locally
# before tagging a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Build installer
        run: npm run package:windows

      - name: Locate installer
        id: installer
        shell: bash
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#files[@]}" -ne 1 ]; then echo "Expected one installer, found ${#files[@]}." >&2; exit 1; fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${files[0]}")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          notes="Download ${{ steps.installer.outputs.name }} below and run it to install or update unArchive on Windows 10 or 11."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$INSTALLER" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$INSTALLER" --repo "$GITHUB_REPOSITORY" --title "unArchive $GITHUB_REF_NAME" --notes "$notes"
          fi
