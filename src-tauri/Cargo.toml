[package]
name = "unarchive"
version = "0.2.2"
description = "Build CPS codeplug workbooks locally"
authors = ["unArchive"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-updater = "~2.12.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
